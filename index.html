<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">

<title>Gaiters FC | Club</title>
<style>
:root{--g:#001648;--g2:#12306f;--gold:#e2222b;--paper:#f3f5f9;--ink:#1a221d;--muted:#66708a;--line:#dde1ea;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 Barlow,"Segoe UI",system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}
h1,h2,h3,.brand strong,.stat strong,.crest,.eyebrow,.llogo{width:110px;display:block;margin:0 auto 12px}.lbox{text-align:left}.lbox h1{font-family:"Barlow Condensed","Arial Narrow",Barlow,sans-serif}
.app{min-height:100vh;display:grid;grid-template-columns:232px 1fr}.sidebar{background:var(--g);color:#fff;padding:22px 0;display:flex;flex-direction:column;gap:26px}
.logotile{background:#fff;margin:0 16px;border-radius:4px;padding:12px;text-align:center}.logotile img{width:100%;max-width:140px;display:block;margin:0 auto}.brand{display:flex;gap:12px;align-items:center;padding:0 20px}.crest{height:44px;width:38px;background:var(--gold);color:var(--g);font-weight:700;display:grid;place-items:center;clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%);font-size:15px;padding-bottom:6px}
.brand strong{display:block;font-size:19px;letter-spacing:1.2px;font-weight:600;line-height:1.1}.brand span{font-size:10px;color:#a8b6d8;letter-spacing:1.5px}
.navlabel{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:#8798c4;padding:0 20px;margin:0 0 6px}.nav{display:grid}
.nav button{border:0;background:transparent;color:#d3dcf0;padding:11px 20px;text-align:left;font-size:14px;border-left:3px solid transparent}.nav .ico,.stat .symbol{display:none}
.nav button:hover{background:#0d2260;color:#fff}.nav button.active{background:#0d2260;color:#fff;border-left-color:var(--gold);font-weight:600}
.sidebottom{margin-top:auto;border-top:1px solid #27407f;padding:16px 20px 0;color:#9aa9d0;font-size:12px}
.main{min-width:0}.topbar{height:68px;background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;gap:15px}
.topbar strong{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:20px;font-weight:600;letter-spacing:.3px}.crumb{color:var(--muted);font-size:12px}.topright{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:4px;background:var(--g);display:grid;place-items:center;font-weight:700;color:#fff;font-size:12px;letter-spacing:.5px}.user small{display:block;color:var(--muted);font-size:11px}.user strong{font-family:inherit;font-size:13px;font-weight:600}
.content{padding:28px 32px;max-width:1500px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px;padding-bottom:18px;border-bottom:2px solid var(--g)}
.eyebrow{color:#c1121f;text-transform:uppercase;font-weight:600;letter-spacing:2px;font-size:12px;margin-bottom:2px}.pagehead h1{font-size:34px;font-weight:600;letter-spacing:.3px;margin:0 0 2px;text-transform:uppercase;line-height:1.1}.pagehead p{color:var(--muted);margin:0}
.btn{border:1px solid #c9cfdd;background:var(--white);padding:9px 15px;border-radius:4px;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:8px}.btn:hover{border-color:var(--g)}
.btn.primary{background:var(--g);color:#fff;border-color:var(--g)}.btn.primary:hover{background:var(--g2)}.btn.green{background:var(--gold);color:#fff;border-color:var(--gold)}.btn.small{padding:5px 10px;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}.stat,.panel{background:var(--white);border:1px solid var(--line);border-radius:4px}.stat{padding:16px 18px;border-top:3px solid var(--g)}
.stathead{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1.2px;font-weight:600}.stat strong{display:block;font-size:40px;font-weight:600;line-height:1;margin:10px 0 6px}.stat small{color:var(--muted);font-size:12px}
.cols{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,1fr);gap:18px}.panel{padding:20px;margin-bottom:18px;min-width:0}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.panelhead h2{font-size:20px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;margin:0}.panelhead p{color:var(--muted);font-size:12px;margin:0}.textlink{border:0;background:none;color:var(--g2);font-weight:700;font-size:12px;padding:0}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid #e8ebf1}.task:first-of-type{border-top:0}.check{height:19px;width:19px;border:1.5px solid #aab2c8;border-radius:3px;flex:none;background:#fff;color:#fff}.check.done{background:var(--g2);border-color:var(--g2)}
.taskbody{flex:1;min-width:0}.taskbody strong{display:block;font-size:14px;font-weight:600}.taskbody small{color:var(--muted);font-size:12px;display:block;margin-top:2px}.task.done .taskbody strong{text-decoration:line-through;color:#9aa1b5}
.pill{display:inline-flex;align-items:center;padding:3px 8px;border-radius:3px;font-size:11px;font-weight:700;background:#e9ecf3;color:#555e78;white-space:nowrap}.pill.green{background:#dcebdf;color:#1f5a3a}.pill.orange{background:#f6e7c8;color:#7d5413}.pill.red{background:#f3d9d5;color:#8c332b}
.fixture{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #e8ebf1}.fixture:first-of-type{border-top:0}.datebox{background:var(--g);color:#fff;border-radius:3px;width:48px;min-width:48px;text-align:center;padding:6px 3px}
.datebox b{font:600 22px/1 "Barlow Condensed","Arial Narrow",sans-serif;display:block}.datebox span{font-size:10px;color:#ff9aa0;font-weight:700;letter-spacing:1px}.fixturebody{flex:1;min-width:0}.fixturebody strong{display:block;font-size:14px}.fixturebody small{color:var(--muted);font-size:12px}
.activity{display:flex;gap:11px;padding:9px 0}.dot{width:7px;height:7px;background:var(--gold);border-radius:1px;margin-top:7px;flex:none}.activity p{margin:0;font-size:13px}.activity small{color:var(--muted);font-size:11px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.search{min-width:220px;flex:1;border:1px solid #cdd3e0;border-radius:4px;background:#fff;padding:9px 12px}.search:focus{outline:2px solid #c3cde8;border-color:var(--g2)}
.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:600px}.table th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;background:#f5f6fa;padding:10px 12px;border-bottom:2px solid var(--line)}
.table td{padding:12px;border-bottom:1px solid #e8ebf1;font-size:13px;vertical-align:middle}.table tbody tr:hover{background:#f8f9fc}.table tr:last-child td{border-bottom:0}.table td:last-child{white-space:nowrap}.table td .btn.small{margin:1px 0}
.person{display:flex;align-items:center;gap:10px}.personpic{width:34px;height:34px;border-radius:3px;background:#e3e8f4;color:var(--g);display:grid;place-items:center;font-weight:700;font-size:12px}.person strong{display:block;font-size:13px}.person small{display:block;color:var(--muted);font-size:11px}
.empty{padding:32px 15px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--ink);margin-bottom:4px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:700;color:#454d66;text-transform:uppercase;letter-spacing:.6px}
.field input,.field select,.field textarea{width:100%;border:1px solid #cdd3e0;border-radius:4px;padding:9px 11px;background:#fff;outline:none}.field textarea{min-height:85px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--g2);box-shadow:0 0 0 3px #dfe4f4}
.modalback{position:fixed;inset:0;background:#000b2699;display:none;align-items:center;justify-content:center;padding:18px;z-index:60}.modalback.show{display:flex}.modal{width:min(600px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:6px;padding:24px;border-top:4px solid var(--g)}
.modalhead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:18px}.modalhead h2{margin:0;font-size:24px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}.x{border:0;background:#e9ecf3;border-radius:3px;width:32px;height:32px;font-size:20px}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.notice{background:#fdeced;border-left:3px solid var(--gold);padding:11px 14px;font-size:12px;color:#7a1a20;margin-top:16px}.toast{position:fixed;bottom:20px;right:20px;background:var(--g);color:#fff;padding:12px 17px;border-radius:4px;border-left:3px solid var(--gold);display:none;z-index:90}.toast.show{display:block}.mobilemenu{display:none}
.qmenu{display:none;position:absolute;right:0;top:110%;background:#fff;border:1px solid var(--line);border-radius:4px;box-shadow:0 10px 30px #0002;min-width:170px;z-index:40;padding:4px}.qmenu.show{display:grid}.qmenu button{border:0;background:none;text-align:left;padding:8px 12px;border-radius:3px}.qmenu button:hover{background:#edf0f8}
@media(max-width:1000px){.app{grid-template-columns:200px 1fr}.content{padding:24px 20px}.topbar{padding:0 20px}.stats{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}}
@media(max-width:680px){.app{display:block}.sidebar{display:none}.sidebar.open{display:flex;position:fixed;inset:0 22% 0 0;z-index:70;overflow:auto;box-shadow:0 0 0 100vw #0008}.topbar{height:60px;padding:0 14px}.mobilemenu{display:inline-flex}.content{padding:20px 14px}.pagehead h1{font-size:28px}.stats{gap:9px}.stat{padding:12px}.stat strong{font-size:32px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.topright .user{display:none}.toolbar .search{min-width:100%}}
.pos{display:inline-block;min-width:34px;text-align:center;padding:3px 6px;border-radius:6px;font-size:10px;font-weight:800;margin-right:6px}.pos.gk{background:#fff0df;color:#9a5a17}.pos.def{background:#e3effa;color:#2d5f8b}.pos.mid{background:#e8f6dc;color:#426d25}.pos.att{background:#ffebeb;color:#a54242}.pos.oth{background:#eef2f5;color:#526170}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#5f7b42;font-weight:800;border-bottom:1px solid var(--line);padding:6px 0;margin-top:6px}
.modal.wide{width:min(820px,100%)}.doc{border:1px solid var(--line);border-radius:10px;padding:22px;background:#fffefb;font:13px/1.6 Georgia,serif}.doc h2{text-align:center;margin:0}.doc h3{font-size:13px;margin:14px 0 2px}.doc p{margin:4px 0}.doc .ref{text-align:center;color:#66708a;font-size:11px}.doc table{width:100%;border-collapse:collapse;margin:12px 0}.doc td{border:1px solid #e3e0d6;padding:6px 8px;font-size:12px}.doc td:first-child{width:34%;background:#faf8f1;font-weight:700}
.sigrow{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.sigbox{border:1px solid var(--line);border-radius:10px;padding:12px}.sigbox label{font-size:11px;font-weight:800;color:#526170}.sigbox input[type=text]{width:100%;border:1px solid #dce3ea;border-radius:8px;padding:8px;margin:6px 0}canvas.sig{width:100%;height:140px;border:1.5px dashed #b9c5d1;border-radius:10px;background:#fff;touch-action:none}.sigbox img{max-height:90px;max-width:100%}
@media(max-width:680px){.sigrow{grid-template-columns:1fr}}
.posrow{display:flex;gap:8px;flex-wrap:wrap}.posrow select{flex:1;min-width:140px;border:1px solid #dce3ea;border-radius:8px;padding:10px 11px;background:#fff}#pchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.chip{display:inline-flex;align-items:center;gap:6px;background:#f1f5f7;border-radius:99px;padding:4px 6px 4px 8px;font-size:12px}.chip .pos{margin:0}.chip button{border:0;background:#dde4ea;border-radius:50%;width:18px;height:18px;line-height:1;padding:0}
#login{position:fixed;inset:0;z-index:100;background:repeating-linear-gradient(90deg,#001648 0 80px,#0a1d57 80px 160px);display:grid;place-items:center;padding:20px}#login.hide{display:none}.lbox{background:#fff;border-radius:6px;border-top:4px solid var(--gold);padding:30px;width:min(400px,100%)}.lbox h1{margin:0 0 2px;font-size:32px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}.lbox p{margin:0 0 18px;color:#66708a;font-size:13px}.lbox label{display:block;font-size:12px;font-weight:700;margin:12px 0 5px}.lbox select,.lbox input{width:100%;border:1px solid #cdd3e0;border-radius:4px;padding:11px;font:inherit}.lbox .btn{width:100%;margin-top:18px;justify-content:center}#loginErr{color:#a54242;font-size:12px;min-height:16px;margin-top:10px}
</style>
</head>

function posUI(){const fill=()=>{$("#pcode").innerHTML=Object.entries(POS[$("#pgroup").value]).map(([c,n])=>`<option value="${c}">${n} (${c})</option>`).join("")},cur=()=>$("#posval").value.split(",").filter(Boolean),draw=()=>{let l=cur();$("#pchips").innerHTML=l.length?l.map((c,i)=>`<span class="chip"><span class="pos ${GC[POSGRP[c]]||"oth"}">${esc(c)}</span>${esc(POSNAME[c]||c)}${i===0?" <small>(main)</small>":""}<button type="button" data-rmpos="${c}">×</button></span>`).join(""):`<small style="color:#66708a">No position added yet</small>`};let l=cur();if(l[0]&&POSGRP[l[0]])$("#pgroup").value=POSGRP[l[0]].slice(0,-1);fill();draw();$("#pgroup").onchange=fill;$("#padd").onclick=()=>{let c=$("#pcode").value,l=cur();if(!l.includes(c))l.push(c);$("#posval").value=l.join(",");draw()};$("#pchips").onclick=e=>{let b=e.target.closest("[data-rmpos]");if(!b)return;$("#posval").value=cur().filter(x=>x!==b.dataset.rmpos).join(",");draw()}}
const CH=["Player","Type","Term","Signed from","Status","Actions"];
function contractRow(c){let p=db.players.find(x=>x.id===c.playerId),nm=p?p.name:(c.playerName||"Unknown")+" (removed)",st=eff(c),d=Math.ceil((new Date(c.endDate+"T12:00:00")-Date.now())/864e5),left=st==="Signed"?(d<=90?`<span class="pill orange">${d} days left</span>`:`<small style="color:#66708a">${d} days left</small>`):"";return `<tr><td><div class="person"><div class="personpic">${esc(ini(nm))}</div><div><strong>${esc(nm)}</strong><small>${p?esc(posCode(p)):"Not set"}</small></div></div></td><td>${esc(c.type)}</td><td>${dateFmt(c.startDate)} to ${dateFmt(c.endDate)}<br>${left}</td><td>${esc(c.sourceName||"Not set")}<br><small style="color:#66708a">${c.trainingCompensation>0?"Training comp "+money(c.trainingCompensation):esc(c.sourceType||"")}</small></td><td>${pill(st)}</td><td><button class="btn small" data-contract="${c.id}">${["Draft","Awaiting signature"].includes(st)?"Sign":"View"}</button> ${st==="Terminated"?"":`<button class="btn small" data-edit="contracts:${c.id}">Edit</button> `}<button class="btn small" data-delete="contracts:${c.id}">Delete</button></td></tr>`}
function contractsPage(){let C=db.contracts,in90=new Date(Date.now()+90*864e5).toISOString().slice(0,10),act=C.filter(c=>eff(c)==="Signed"),none=db.players.filter(p=>!C.some(c=>c.playerId===p.id&&live(c)));return `${head("Registration","Contracts","Academy contracts, signatures and expiry dates.",`<button class="btn primary" data-add="contracts">New contract</button>`)}<div class="stats">${stat("Players under contract",new Set(act.map(c=>c.playerId)).size,"Fully signed and in date","✓")}${stat("Awaiting signature",C.filter(c=>["Draft","Awaiting signature"].includes(eff(c))).length,"Draft or partly signed","✎")}${stat("Expiring in 90 days",act.filter(c=>c.endDate<=in90).length,"Plan renewals early","◷")}${stat("Without a contract",none.length,"No live contract","♙")}</div><div class="panel"><div class="panelhead"><div><h2>Players with contracts</h2><p>Open a contract to sign, print or terminate it</p></div></div><div class="toolbar"><input class="search" id="filterSearch" placeholder="Search by player or contract type"><select class="search" id="statusFilter" style="max-width:200px;flex:0 0 200px"><option value="">All statuses</option><option>Signed</option><option>Awaiting signature</option><option>Draft</option><option>Expired</option><option>Terminated</option></select></div><div id="tableArea">${table(CH,C.map(contractRow).join(""),"No contracts created yet")}</div></div><div class="panel"><div class="panelhead"><div><h2>Players without a contract</h2><p>Start a contract for any player below</p></div></div>${none.length?table(["Player","Position","Status","Action"],none.map(p=>`<tr><td><strong>${esc(p.name)}</strong></td><td>${posTag(p)}</td><td>${pill(p.status)}</td><td><button class="btn small green" data-newcontract="${p.id}">Create contract</button></td></tr>`).join("")):`<div class="empty"><b>Every player has a contract</b></div>`}<div class="notice">The contract wording is a template. Have a lawyer check it against league and federation rules before use. Records are saved on this device.</div></div>`}
function contractText(c){let p=db.players.find(x=>x.id===c.playerId)||{},nm=c.playerName||p.name||"the Player",g=c.guardianName?`, acting through the Player's parent or guardian <b>${esc(c.guardianName)}</b>`:"",r=(a,b)=>`<tr><td>${a}</td><td>${esc(b||"Not set")}</td></tr>`,y=c.years||Math.max(1,Math.round((new Date(c.endDate)-new Date(c.startDate))/31557600000)),src=esc(c.sourceName||"the previous club or person");return `<div class="doc"><img src="${LOGO}" alt="" style="display:block;margin:0 auto 6px;width:84px"><h2>ACADEMY PLAYER CONTRACT</h2><p class="ref">Gaiters FC · Reference GFC-${String(c.id).slice(-6)}</p><p>This agreement is made between <b>Gaiters FC</b> (“the Club”) and <b>${esc(nm)}</b> (“the Player”)${g}.</p><table>${r("Player",nm)}${r("Positions",posNames(p))}${r("Date of birth",dateFmt(c.dob))}${r("Nationality",c.nationality)}${r("Address",c.address)}${r("ID number",c.idNumber)}${r("Next of kin",c.nextOfKin)}${r("Contract type",c.type)}${r("Term",dateFmt(c.startDate)+" to "+dateFmt(c.endDate)+" ("+y+" year"+(y>1?"s":"")+")")}${r("Signed from",(c.sourceName||"")+(c.sourceType?" ("+c.sourceType+")":""))}${r("Source contact",c.sourceContact)}</table>
<h3>1. Term</h3><p>The Player joins the Club academy for ${y} year${y>1?"s":""}, from ${dateFmt(c.startDate)} until ${dateFmt(c.endDate)}, unless ended earlier under clause 9.</p><h3>2. Position and duties</h3><p>The Player plays as ${esc(posList(p).length?posNames(p):"a player")} and agrees to train and play to the best of their ability, follow the coaching staff's instructions and attend all training sessions, matches and club events.</p><h3>3. Academy status</h3><p>The Player is an academy player and is not paid a wage, signing fee or appearance fee. The Club provides coaching, training facilities and development in return for the Player's commitment.</p><h3>4. Where the Player came from and training compensation</h3><p>The Player joined the Club from ${src}${c.sourceType?" ("+esc(c.sourceType)+")":""}. ${c.trainingCompensation>0?`The Club shall pay training compensation of ${money(c.trainingCompensation)} to ${src}${c.trainingCompTerms?", on these terms: "+esc(c.trainingCompTerms):""}.`:"No training compensation is payable."}</p><h3>5. Bonuses and share of future transfer</h3><p>${c.bonusAmount>0?`The Club shall pay ${src} a bonus of ${money(c.bonusAmount)}.`:"No fixed bonus is payable."} ${c.sellOnPercent>0?`If the Player is later transferred to another club for a fee, ${src} is entitled to ${c.sellOnPercent}% of that fee.`:"No share of a future transfer fee applies."} ${esc(c.bonusTerms||"")}</p><h3>6. Conduct and discipline</h3><p>The Player shall follow the Club's rules and code of conduct. Breaches may lead to fines or suspension under the Club's disciplinary procedure.</p><h3>7. Medical and fitness</h3><p>The Player confirms they are fit to play, will attend medical checks and will promptly report any injury or illness.</p><h3>8. Image rights</h3><p>The Player allows the Club to use their name and image for club purposes, including kit, website and social media.</p><h3>9. Termination</h3><p>Either party may end this contract for serious breach by written notice. Early termination is subject to applicable football regulations.</p><h3>10. Additional terms</h3><p>${esc(c.clauses||"None.")}</p><h3>11. Governing law</h3><p>This contract is governed by the laws of the Federal Republic of Nigeria. Disputes shall first be resolved amicably.</p></div>`}
function sigPanel(c,w){let s=(c.sig||{})[w],lab=w==="player"?(c.guardianName?"Player / Guardian":"Player"):"Club official";if(s)return `<div class="sigbox"><label>${lab}</label><div><img src="${s.img}"></div><small>Signed by ${esc(s.name)} on ${dateFmt(s.date)}</small></div>`;if(!live(c))return `<div class="sigbox"><label>${lab}</label><p><small>Not signed</small></p></div>`;return `<div class="sigbox"><label>${lab} signature</label><canvas class="sig" data-pad="${w}"></canvas><input type="text" id="sn_${w}" placeholder="Type full name" value="${esc(w==="player"?(c.guardianName||c.playerName):"Club Admin")}"><button type="button" class="btn small" data-clearpad="${w}">Clear</button></div>`}
function initPads(){pads={};document.querySelectorAll("canvas.sig").forEach(cv=>{let r=cv.getBoundingClientRect();cv.width=Math.max(300,Math.round(r.width));cv.height=140;let x=cv.getContext("2d");x.lineWidth=2.2;x.lineCap=x.lineJoin="round";x.strokeStyle="#10253b";let st={inked:false,on:false};pads[cv.dataset.pad]={cv,ctx:x,st};let pos=e=>{let b=cv.getBoundingClientRect();return[(e.clientX-b.left)*cv.width/b.width,(e.clientY-b.top)*cv.height/b.height]};cv.onpointerdown=e=>{st.on=true;cv.setPointerCapture(e.pointerId);let[a,b]=pos(e);x.beginPath();x.moveTo(a,b);x.lineTo(a+.01,b+.01);x.stroke();st.inked=true;e.preventDefault()};cv.onpointermove=e=>{if(!st.on)return;let[a,b]=pos(e);x.lineTo(a,b);x.stroke()};cv.onpointerup=cv.onpointercancel=()=>{st.on=false}})}
function openContract(id){let c=db.contracts.find(x=>x.id===id);if(!c)return;curC=id;let st=eff(c),sg=c.sig||{},open=live(c)&&!(sg.player&&sg.club);$("#cTitle").textContent="Contract for "+c.playerName;$("#cBody").innerHTML=`<div style="margin-bottom:12px">${pill(st)}</div>${contractText(c)}<div class="sigrow">${sigPanel(c,"player")}${sigPanel(c,"club")}</div>${open?`<label style="display:flex;gap:8px;margin-top:14px;font-size:12px"><input type="checkbox" id="agree"> I confirm the contract has been read and the signers agree to its terms.</label>`:""}`;$("#cFoot").innerHTML=`<button class="btn" data-act="close">Close</button><button class="btn" data-act="print">Print / Save PDF</button>${st==="Signed"?`<button class="btn" data-act="terminate">Terminate</button>`:""}${open?`<button class="btn green" data-act="sign">Save signatures</button>`:""}`;$("#cmodal").classList.add("show");initPads()}
function closeC(){$("#cmodal").classList.remove("show")}
function saveSignatures(){let c=db.contracts.find(x=>x.id===curC),sig={...(c.sig||{})},n=0;if(!Object.values(pads).some(p=>p.st.inked)){toast("Draw a signature first");return}if(!$("#agree").checked){toast("Tick the confirmation box");return}for(let w of["player","club"]){let p=pads[w];if(sig[w]||!p||!p.st.inked)continue;let nm=($("#sn_"+w).value||"").trim();if(!nm){toast("Type the signer's full name");return}sig[w]={name:nm,img:p.cv.toDataURL("image/png"),date:todayStr()};n++}c.sig=sig;c.status=sig.player&&sig.club?"Signed":"Awaiting signature";save();render();openContract(c.id);toast(c.status==="Signed"?"Contract fully signed":"Signature saved, awaiting the other party")}
function terminateContract(){if(!confirm("Terminate this contract?"))return;let c=db.contracts.find(x=>x.id===curC);c.status="Terminated";save();render();openContract(c.id)}
function printContract(){let c=db.contracts.find(x=>x.id===curC),w=window.open("","_blank");if(!w){toast("Allow pop ups to print");return}let b=k=>{let s=(c.sig||{})[k];return `<div>${s?`<img src="${s.img}" style="max-height:80px"><br>${esc(s.name)} · ${dateFmt(s.date)}`:'<div style="height:60px"></div>'}<hr>${k==="player"?"Player / Guardian":"Club official"}</div>`};w.document.write(`<!doctype html><title>Contract</title><style>body{font:13px/1.6 Georgia,serif;max-width:760px;margin:30px auto;padding:0 20px}h2,.ref{text-align:center}table{width:100%;border-collapse:collapse}td{border:1px solid #ccc;padding:6px 8px}h3{font-size:13px;margin:14px 0 2px}.s{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:40px}.posrow{display:flex;gap:8px;flex-wrap:wrap}.posrow select{flex:1;min-width:140px;border:1px solid #dce3ea;border-radius:8px;padding:10px 11px;background:#fff}#pchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.chip{display:inline-flex;align-items:center;gap:6px;background:#f1f5f7;border-radius:99px;padding:4px 6px 4px 8px;font-size:12px}.chip .pos{margin:0}.chip button{border:0;background:#dde4ea;border-radius:50%;width:18px;height:18px;line-height:1;padding:0}
</style>${contractText(c)}<div class="s">${b("player")}${b("club")}</div>`);w.document.close();setTimeout(()=>w.print(),300)}
document.addEventListener("click",e=>{let n=e.target.closest("[data-contract]");if(n){e.preventDefault();openContract(Number(n.dataset.contract));return}if(n=e.target.closest("[data-newcontract]")){openForm("contracts",null,(pl=>({playerId:Number(n.dataset.newcontract),dob:pl.dob||"",nationality:pl.nationality||""}))(db.players.find(q=>q.id===Number(n.dataset.newcontract))||{}));return}if(n=e.target.closest("[data-clearpad]")){let p=pads[n.dataset.clearpad];if(p){p.ctx.clearRect(0,0,p.cv.width,p.cv.height);p.st.inked=false}return}if(n=e.target.closest("[data-act]")){let a=n.dataset.act;if(a==="close")closeC();if(a==="sign")saveSignatures();if(a==="print")printContract();if(a==="terminate")terminateContract();return}if(e.target.id==="cmodal"||e.target.id==="cClose")closeC()});
const ROLES={manager:{label:"Team Manager",av:"TM",home:"dashboard",pages:["dashboard","players","staff","contracts","tasks","fixtures","training","medical","analysis","documents"]},finance:{label:"Finance and Operations",av:"FO",home:"finance",pages:["finance"]},medical:{label:"Medical",av:"MD",home:"medical",pages:["medical"]}};
let role=null,userEmail="";
const can=p=>!!role&&ROLES[role].pages.includes(p);
function applyRole(){let R=ROLES[role];$("#login").classList.add("hide");document.querySelectorAll("#nav button").forEach(b=>b.style.display=can(b.dataset.page)?"":"none");$("#uName").textContent=R.label;$("#uRole").textContent=userEmail;$("#uAv").textContent=R.av;page=R.home;render();window.scrollTo(0,0)}
async function start(){const{data:u}=await SB.auth.getUser();userEmail=(u&&u.user&&u.user.email)||"";const{data:r,error}=await SB.rpc("my_role");if(error||!ROLES[r]){await SB.auth.signOut();throw new Error("This account has no access yet. Ask the Team Manager.")}role=r;await loadAll();applyRole()}
$("#loginForm").onsubmit=async e=>{e.preventDefault();const b=$("#loginForm button");$("#loginErr").textContent="";b.disabled=true;try{const{error}=await SB.auth.signInWithPassword({email:$("#loginEmail").value.trim(),password:$("#loginPw").value});if(error)throw error;$("#loginPw").value="";await start()}catch(err){$("#loginErr").textContent=err.message==="Invalid login credentials"?"Wrong email or password":(err.message||"Could not sign in")}b.disabled=false};
$("#outBtn").onclick=async()=>{await SB.auth.signOut();role=null;COLS.forEach(k=>db[k]=[]);$("#content").innerHTML="";$("#modalback").classList.remove("show");$("#cmodal").classList.remove("show");$("#login").classList.remove("hide")};
$("#pwBtn").onclick=async()=>{let n=prompt("New password (at least 8 characters):");if(!n||n.length<8){toast("Password not changed");return}const{error}=await SB.auth.updateUser({password:n});toast(error?error.message:"Password changed")};
async function refresh(){if(!role||pending||document.querySelector(".modalback.show"))return;try{let before=JSON.stringify(db);await loadAll();if(JSON.stringify(db)!==before)render()}catch{}}
setInterval(refresh,60000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
SB.auth.getSession().then(({data})=>{if(data.session)start().catch(()=>{})});
