let db={};Object.keys(seed).forEach(k=>{try{db[k]=JSON.parse(localStorage.getItem("gfc_"+k))||seed[k]}catch{db[k]=seed[k]}});

const $=s=>document.querySelector(s);
const POS={Goalkeeper:{GK:"Goalkeeper"},Defender:{CB:"Centre Back",RB:"Right Back",LB:"Left Back",RWB:"Right Wing Back",LWB:"Left Wing Back",SW:"Sweeper"},Midfielder:{DM:"Defensive Midfielder",CM:"Central Midfielder",AM:"Attacking Midfielder",RM:"Right Midfielder",LM:"Left Midfielder"},Attacker:{RW:"Right Winger",LW:"Left Winger",SS:"Second Striker",CF:"Centre Forward",ST:"Striker"}};
const GC={Goalkeepers:"gk",Defenders:"def",Midfielders:"mid",Attackers:"att"},POSNAME={},POSGRP={};Object.entries(POS).forEach(([g,o])=>Object.entries(o).forEach(([c,n])=>{POSNAME[c]=n;POSGRP[c]=g+"s"}));
function legacyPos(t){t=String(t||"");let c=t.split(" ")[0];if(POSNAME[c])return[c];t=t.toLowerCase();let m={goal:"GK",defend:"CB",mid:"CM",forward:"ST",wing:"RW",strik:"ST"};for(let k in m)if(t.includes(k))return[m[k]];return[]}
const posList=p=>p?(Array.isArray(p.positions)?p.positions:legacyPos(p.position)):[],posCode=p=>posList(p).join(", "),posNames=p=>posList(p).map(c=>POSNAME[c]||c).join(", ")||"Not set",inGroup=(p,g)=>posList(p).some(c=>POSGRP[c]===g);


function posTag(p){let l=posList(p);return l.length?l.map(c=>`<span class="pos ${GC[POSGRP[c]]||"oth"}" title="${esc(POSNAME[c]||c)}">${esc(c)}</span>`).join("")+`<small style="display:block;color:#728091;margin-top:3px">${esc(posNames(p))}</small>`:`<small style="color:#728091">Not set</small>`}
function optsHtml(o,val){if(typeof o==="function")o=o();const one=x=>{let v=typeof x==="object"?x.v:x,l=typeof x==="object"?x.l:x;return `<option value="${esc(v)}" ${String(v)===String(val)?"selected":""}>${esc(l)}</option>`};if(Array.isArray(o)){let l=o.slice();if(val&&l.every(x=>typeof x!=="object")&&!l.includes(val))l.unshift(String(val));return l.map(one).join("")}let all=Object.values(o).flat();return (val&&!all.includes(val)?`<option selected>${esc(val)}</option>`:"")+Object.entries(o).map(([g,l])=>`<optgroup label="${g}">${l.map(one).join("")}</optgroup>`).join("")}
const todayStr=()=>new Date().toISOString().slice(0,10),ini=n=>String(n||"?").split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase(),money=n=>"₦"+Number(n||0).toLocaleString("en-NG");

let pads={},curC=null;

function save(){Object.keys(db).forEach(k=>localStorage.setItem("gfc_"+k,JSON.stringify(db[k])))}

function stat(label,value,sub,symbol){return `<div class="stat"><div class="stathead"><span>${label}</span><span class="symbol">${symbol}</span></div><strong>${value}</strong><small>${sub}</small></div>`}
function taskRows(items){if(!items.length)return `<div class="empty"><b>No tasks yet</b>Add a task to start tracking work.</div>`;return items.map(t=>`<div class="task ${t.status==="Completed"?"done":""}"><button class="check ${t.status==="Completed"?"done":""}" data-toggle-task="${t.id}" title="Mark complete">${t.status==="Completed"?"✓":""}</button><div class="taskbody"><strong>${esc(t.title)}</strong><small>${esc(t.assignee||"Unassigned")} · Due ${dateFmt(t.due)}</small></div>${pill(t.status)}</div>`).join("")}
function fixtureRows(items){if(!items.length)return `<div class="empty"><b>No fixtures or sessions</b>Add your next match or training session.</div>`;return items.slice().sort((a,b)=>(a.date||"").localeCompare(b.date||"")).map(f=>{let d=f.date?new Date(f.date+"T12:00:00"):null;return `<div class="fixture"><div class="datebox"><b>${d?d.getDate():"?"}</b><span>${d?d.toLocaleDateString("en-GB",{month:"short"}).toUpperCase():"DATE"}</span></div><div class="fixturebody"><strong>${esc(f.opponent)}</strong><small>${esc(f.type)} · ${esc(f.time||"Time TBC")} · ${esc(f.venue||"Venue TBC")}</small></div>${pill(f.status)}</div>`}).join("")}

function openForm(type,id=null,preset={}){if(type==="contracts"&&!db.players.length){toast("Add a player first");return}formType=type;editId=id;let record=id?db[type].find(x=>x.id===id):preset;$("#modalTitle").textContent=(id?"Edit ":"Add ")+({players:"player",staff:"staff member",tasks:"task",fixtures:"event",training:"training session",medical:"medical record",analysis:"analysis report",finance:"expense",documents:"document record",contracts:"contract"}[type]);$("#formFields").innerHTML=fields[type].map(f=>{let [key,label,kind,required,opts]=f;if(kind==="section")return `<div class="field full"><div class="sec">${label}</div></div>`;if(kind==="positions")return `<div class="field full"><label>Positions *</label><div class="posrow"><select id="pgroup">${Object.keys(POS).map(g=>`<option>${g}</option>`).join("")}</select><select id="pcode"></select><button type="button" class="btn" id="padd">Add position</button></div><div id="pchips"></div><input type="hidden" name="positions" id="posval" value="${esc(posList(record).join(","))}"></div>`;let val=record[key]??(key==="status"?({"players":"Active","staff":"Active","tasks":"To do","fixtures":"Planning","finance":"Pending"}[type]||""):(key==="priority"?"Medium":""));let input=kind==="select"?`<select name="${key}" ${required?"required":""}>${optsHtml(opts,val)}</select>`:kind==="textarea"?`<textarea name="${key}" placeholder="Add details…">${esc(val)}</textarea>`:`<input name="${key}" type="${kind}" value="${esc(val)}" ${required?"required":""} ${kind==="number"?'min="0"':''}>`;return `<div class="field ${kind==="textarea"?"full":""}"><label>${label}${required?" *":""}</label>${input}</div>`}).join("");$("#modalback").classList.add("show");if(type==="players")posUI()}

$("#entryForm").addEventListener("submit",e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target).entries());if(formType==="finance")data.amount=Number(data.amount);if(formType==="players"){data.positions=(data.positions||"").split(",").filter(Boolean);if(!data.positions.length){toast("Add at least one position");return}}if(formType==="contracts"){data.playerId=Number(data.playerId);let pl=db.players.find(p=>p.id===data.playerId);if(!pl){toast("Select a player");return}data.playerName=pl.name;["years","trainingCompensation","bonusAmount","sellOnPercent"].forEach(k=>data[k]=Number(data[k]||0));if(data.years<1){toast("Contract length must be at least 1 year");return}let ed=new Date(data.startDate+"T12:00:00");ed.setFullYear(ed.getFullYear()+data.years);ed.setDate(ed.getDate()-1);data.endDate=ed.toISOString().slice(0,10);if(editId){let ex=db.contracts.find(x=>x.id===editId);if(ex&&ex.sig&&(ex.sig.player||ex.sig.club)){if(!confirm("This contract has signatures. Saving changes clears them and requires signing again. Continue?"))return;data.sig=null;data.status="Draft"}}else{if(db.contracts.some(c=>c.playerId===data.playerId&&live(c))&&!confirm("This player already has an active or pending contract. Create another?"))return;data.status="Draft";data.sig=null}}if(editId){let i=db[formType].findIndex(x=>x.id===editId);if(i>=0)db[formType][i]={...db[formType][i],...data}}else{data.id=Date.now();db[formType].unshift(data)}save();closeForm();render();toast(editId?"Record updated":"Record added")});

document.addEventListener("input",e=>{if(!["filterSearch","statusFilter","positionFilter"].includes(e.target.id))return;let q=($("#filterSearch")?.value||"").toLowerCase(),s=$("#statusFilter")?.value||"",g=$("#positionFilter")?.value||"",type=({players:"players",staff:"staff",tasks:"tasks",contracts:"contracts"})[page];if(!type)return;let arr=db[type].filter(x=>(type==="contracts"?[x.playerName,x.type].join(" "):JSON.stringify(x)).toLowerCase().includes(q)&&(!s||(type==="contracts"?eff(x)===s:x.status===s))&&(!g||inGroup(x,g)));let h=type==="tasks"?table(["Task","Assigned to","Deadline","Priority","Status","Actions"],taskRowsT(arr),"No matching records"):type==="contracts"?table(CH,arr.map(contractRow).join(""),"No matching contracts"):table(peopleHeads(type),peopleRows(type,arr),"No matching records");$("#tableArea").innerHTML=h});
function posUI(){const fill=()=>{$("#pcode").innerHTML=Object.entries(POS[$("#pgroup").value]).map(([c,n])=>`<option value="${c}">${n} (${c})</option>`).join("")},cur=()=>$("#posval").value.split(",").filter(Boolean),draw=()=>{let l=cur();$("#pchips").innerHTML=l.length?l.map((c,i)=>`<span class="chip"><span class="pos ${GC[POSGRP[c]]||"oth"}">${esc(c)}</span>${esc(POSNAME[c]||c)}${i===0?" <small>(main)</small>":""}<button type="button" data-rmpos="${c}">×</button></span>`).join(""):`<small style="color:#728091">No position added yet</small>`};let l=cur();if(l[0]&&POSGRP[l[0]])$("#pgroup").value=POSGRP[l[0]].slice(0,-1);fill();draw();$("#pgroup").onchange=fill;$("#padd").onclick=()=>{let c=$("#pcode").value,l=cur();if(!l.includes(c))l.push(c);$("#posval").value=l.join(",");draw()};$("#pchips").onclick=e=>{let b=e.target.closest("[data-rmpos]");if(!b)return;$("#posval").value=cur().filter(x=>x!==b.dataset.rmpos).join(",");draw()}}

function contractRow(c){let p=db.players.find(x=>x.id===c.playerId),nm=p?p.name:(c.playerName||"Unknown")+" (removed)",st=eff(c),d=Math.ceil((new Date(c.endDate+"T12:00:00")-Date.now())/864e5),left=st==="Signed"?(d<=90?`<span class="pill orange">${d} days left</span>`:`<small style="color:#728091">${d} days left</small>`):"";return `<tr><td><div class="person"><div class="personpic">${esc(ini(nm))}</div><div><strong>${esc(nm)}</strong><small>${p?esc(posCode(p)):"Not set"}</small></div></div></td><td>${esc(c.type)}</td><td>${dateFmt(c.startDate)} to ${dateFmt(c.endDate)}<br>${left}</td><td>${esc(c.sourceName||"Not set")}<br><small style="color:#728091">${c.trainingCompensation>0?"Training comp "+money(c.trainingCompensation):esc(c.sourceType||"")}</small></td><td>${pill(st)}</td><td><button class="btn small" data-contract="${c.id}">${["Draft","Awaiting signature"].includes(st)?"Sign":"View"}</button> ${st==="Terminated"?"":`<button class="btn small" data-edit="contracts:${c.id}">Edit</button> `}<button class="btn small" data-delete="contracts:${c.id}">Delete</button></td></tr>`}
function contractsPage(){let C=db.contracts,in90=new Date(Date.now()+90*864e5).toISOString().slice(0,10),act=C.filter(c=>eff(c)==="Signed"),none=db.players.filter(p=>!C.some(c=>c.playerId===p.id&&live(c)));return `${head("PLAYER REGISTRATION","Contracts","Create contracts, collect signatures and see which players are under contract.",`<button class="btn primary" data-add="contracts">＋ New contract</button>`)}<div class="stats">${stat("Players under contract",new Set(act.map(c=>c.playerId)).size,"Fully signed and in date","✓")}${stat("Awaiting signature",C.filter(c=>["Draft","Awaiting signature"].includes(eff(c))).length,"Draft or partly signed","✎")}${stat("Expiring in 90 days",act.filter(c=>c.endDate<=in90).length,"Plan renewals early","◷")}${stat("Without a contract",none.length,"No live contract","♙")}</div><div class="panel"><div class="panelhead"><div><h2>Players with contracts</h2><p>Open a contract to sign, print or terminate it</p></div></div><div class="toolbar"><input class="search" id="filterSearch" placeholder="Search by player or contract type…"><select class="search" id="statusFilter" style="max-width:200px;flex:0 0 200px"><option value="">All statuses</option><option>Signed</option><option>Awaiting signature</option><option>Draft</option><option>Expired</option><option>Terminated</option></select></div><div id="tableArea">${table(CH,C.map(contractRow).join(""),"No contracts created yet")}</div></div><div class="panel"><div class="panelhead"><div><h2>Players without a contract</h2><p>Start a contract for any player below</p></div></div>${none.length?table(["Player","Position","Status","Action"],none.map(p=>`<tr><td><strong>${esc(p.name)}</strong></td><td>${posTag(p)}</td><td>${pill(p.status)}</td><td><button class="btn small green" data-newcontract="${p.id}">Create contract</button></td></tr>`).join("")):`<div class="empty"><b>Every player has a contract</b></div>`}<div class="notice">Template wording only, not legal advice: have a lawyer review it and confirm it meets league and federation rules. Data and signatures are stored in this browser only.</div></div>`}
function contractText(c){let p=db.players.find(x=>x.id===c.playerId)||{},nm=c.playerName||p.name||"the Player",g=c.guardianName?`, acting through the Player's parent or guardian <b>${esc(c.guardianName)}</b>`:"",r=(a,b)=>`<tr><td>${a}</td><td>${esc(b||"Not set")}</td></tr>`,y=c.years||Math.max(1,Math.round((new Date(c.endDate)-new Date(c.startDate))/31557600000)),src=esc(c.sourceName||"the previous club or person");return `<div class="doc"><h2>ACADEMY PLAYER CONTRACT</h2><p class="ref">Gaiters FC · Reference GFC-${String(c.id).slice(-6)}</p><p>This agreement is made between <b>Gaiters FC</b> (“the Club”) and <b>${esc(nm)}</b> (“the Player”)${g}.</p><table>${r("Player",nm)}${r("Positions",posNames(p))}${r("Date of birth",dateFmt(c.dob))}${r("Nationality",c.nationality)}${r("Address",c.address)}${r("ID number",c.idNumber)}${r("Next of kin",c.nextOfKin)}${r("Contract type",c.type)}${r("Term",dateFmt(c.startDate)+" to "+dateFmt(c.endDate)+" ("+y+" year"+(y>1?"s":"")+")")}${r("Signed from",(c.sourceName||"")+(c.sourceType?" ("+c.sourceType+")":""))}${r("Source contact",c.sourceContact)}</table>
<h3>1. Term</h3><p>The Player joins the Club academy for ${y} year${y>1?"s":""}, from ${dateFmt(c.startDate)} until ${dateFmt(c.endDate)}, unless ended earlier under clause 9.</p><h3>2. Position and duties</h3><p>The Player plays as ${esc(posList(p).length?posNames(p):"a player")} and agrees to train and play to the best of their ability, follow the coaching staff's instructions and attend all training sessions, matches and club events.</p><h3>3. Academy status</h3><p>The Player is an academy player and is not paid a wage, signing fee or appearance fee. The Club provides coaching, training facilities and development in return for the Player's commitment.</p><h3>4. Where the Player came from and training compensation</h3><p>The Player joined the Club from ${src}${c.sourceType?" ("+esc(c.sourceType)+")":""}. ${c.trainingCompensation>0?`The Club shall pay training compensation of ${money(c.trainingCompensation)} to ${src}${c.trainingCompTerms?", on these terms: "+esc(c.trainingCompTerms):""}.`:"No training compensation is payable."}</p><h3>5. Bonuses and share of future transfer</h3><p>${c.bonusAmount>0?`The Club shall pay ${src} a bonus of ${money(c.bonusAmount)}.`:"No fixed bonus is payable."} ${c.sellOnPercent>0?`If the Player is later transferred to another club for a fee, ${src} is entitled to ${c.sellOnPercent}% of that fee.`:"No share of a future transfer fee applies."} ${esc(c.bonusTerms||"")}</p><h3>6. Conduct and discipline</h3><p>The Player shall follow the Club's rules and code of conduct. Breaches may lead to fines or suspension under the Club's disciplinary procedure.</p><h3>7. Medical and fitness</h3><p>The Player confirms they are fit to play, will attend medical checks and will promptly report any injury or illness.</p><h3>8. Image rights</h3><p>The Player allows the Club to use their name and image for club purposes, including kit, website and social media.</p><h3>9. Termination</h3><p>Either party may end this contract for serious breach by written notice. Early termination is subject to applicable football regulations.</p><h3>10. Additional terms</h3><p>${esc(c.clauses||"None.")}</p><h3>11. Governing law</h3><p>This contract is governed by the laws of the Federal Republic of Nigeria. Disputes shall first be resolved amicably.</p></div>`}
function sigPanel(c,w){let s=(c.sig||{})[w],lab=w==="player"?(c.guardianName?"Player / Guardian":"Player"):"Club official";if(s)return `<div class="sigbox"><label>${lab}</label><div><img src="${s.img}"></div><small>Signed by ${esc(s.name)} on ${dateFmt(s.date)}</small></div>`;if(!live(c))return `<div class="sigbox"><label>${lab}</label><p><small>Not signed</small></p></div>`;return `<div class="sigbox"><label>${lab} signature</label><canvas class="sig" data-pad="${w}"></canvas><input type="text" id="sn_${w}" placeholder="Type full name" value="${esc(w==="player"?(c.guardianName||c.playerName):"Club Admin")}"><button type="button" class="btn small" data-clearpad="${w}">Clear</button></div>`}
function initPads(){pads={};document.querySelectorAll("canvas.sig").forEach(cv=>{let r=cv.getBoundingClientRect();cv.width=Math.max(300,Math.round(r.width));cv.height=140;let x=cv.getContext("2d");x.lineWidth=2.2;x.lineCap=x.lineJoin="round";x.strokeStyle="#10253b";let st={inked:false,on:false};pads[cv.dataset.pad]={cv,ctx:x,st};let pos=e=>{let b=cv.getBoundingClientRect();return[(e.clientX-b.left)*cv.width/b.width,(e.clientY-b.top)*cv.height/b.height]};cv.onpointerdown=e=>{st.on=true;cv.setPointerCapture(e.pointerId);let[a,b]=pos(e);x.beginPath();x.moveTo(a,b);x.lineTo(a+.01,b+.01);x.stroke();st.inked=true;e.preventDefault()};cv.onpointermove=e=>{if(!st.on)return;let[a,b]=pos(e);x.lineTo(a,b);x.stroke()};cv.onpointerup=cv.onpointercancel=()=>{st.on=false}})}
function openContract(id){let c=db.contracts.find(x=>x.id===id);if(!c)return;curC=id;let st=eff(c),sg=c.sig||{},open=live(c)&&!(sg.player&&sg.club);$("#cTitle").textContent="Contract for "+c.playerName;$("#cBody").innerHTML=`<div style="margin-bottom:12px">${pill(st)}</div>${contractText(c)}<div class="sigrow">${sigPanel(c,"player")}${sigPanel(c,"club")}</div>${open?`<label style="display:flex;gap:8px;margin-top:14px;font-size:12px"><input type="checkbox" id="agree"> I confirm the contract has been read and the signers agree to its terms.</label>`:""}`;$("#cFoot").innerHTML=`<button class="btn" data-act="close">Close</button><button class="btn" data-act="print">Print / Save PDF</button>${st==="Signed"?`<button class="btn" data-act="terminate">Terminate</button>`:""}${open?`<button class="btn green" data-act="sign">Save signatures</button>`:""}`;$("#cmodal").classList.add("show");initPads()}
function closeC(){$("#cmodal").classList.remove("show")}
function saveSignatures(){let c=db.contracts.find(x=>x.id===curC),sig={...(c.sig||{})},n=0;if(!Object.values(pads).some(p=>p.st.inked)){toast("Draw a signature first");return}if(!$("#agree").checked){toast("Tick the confirmation box");return}for(let w of["player","club"]){let p=pads[w];if(sig[w]||!p||!p.st.inked)continue;let nm=($("#sn_"+w).value||"").trim();if(!nm){toast("Type the signer's full name");return}sig[w]={name:nm,img:p.cv.toDataURL("image/png"),date:todayStr()};n++}c.sig=sig;c.status=sig.player&&sig.club?"Signed":"Awaiting signature";save();render();openContract(c.id);toast(c.status==="Signed"?"Contract fully signed":"Signature saved, awaiting the other party")}
function terminateContract(){if(!confirm("Terminate this contract?"))return;let c=db.contracts.find(x=>x.id===curC);c.status="Terminated";save();render();openContract(c.id)}
function printContract(){let c=db.contracts.find(x=>x.id===curC),w=window.open("","_blank");if(!w){toast("Allow pop ups to print");return}let b=k=>{let s=(c.sig||{})[k];return `<div>${s?`<img src="${s.img}" style="max-height:80px"><br>${esc(s.name)} · ${dateFmt(s.date)}`:'<div style="height:60px"></div>'}<hr>${k==="player"?"Player / Guardian":"Club official"}</div>`};w.document.write(`<!doctype html><title>Contract</title><style>body{font:13px/1.6 Georgia,serif;max-width:760px;margin:30px auto;padding:0 20px}h2,.ref{text-align:center}table{width:100%;border-collapse:collapse}td{border:1px solid #ccc;padding:6px 8px}h3{font-size:13px;margin:14px 0 2px}.s{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:40px}.posrow{display:flex;gap:8px;flex-wrap:wrap}.posrow select{flex:1;min-width:140px;border:1px solid #dce3ea;border-radius:8px;padding:10px 11px;background:#fff}#pchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.chip{display:inline-flex;align-items:center;gap:6px;background:#f1f5f7;border-radius:99px;padding:4px 6px 4px 8px;font-size:12px}.chip .pos{margin:0}.chip button{border:0;background:#dde4ea;border-radius:50%;width:18px;height:18px;line-height:1;padding:0}
</style>${contractText(c)}<div class="s">${b("player")}${b("club")}</div>`);w.document.close();setTimeout(()=>w.print(),300)}
document.addEventListener("click",e=>{let n=e.target.closest("[data-contract]");if(n){e.preventDefault();openContract(Number(n.dataset.contract));return}if(n=e.target.closest("[data-newcontract]")){openForm("contracts",null,{playerId:Number(n.dataset.newcontract)});return}if(n=e.target.closest("[data-clearpad]")){let p=pads[n.dataset.clearpad];if(p){p.ctx.clearRect(0,0,p.cv.width,p.cv.height);p.st.inked=false}return}if(n=e.target.closest("[data-act]")){let a=n.dataset.act;if(a==="close")closeC();if(a==="sign")saveSignatures();if(a==="print")printContract();if(a==="terminate")terminateContract();return}if(e.target.id==="cmodal"||e.target.id==="cClose")closeC()});
const ROLES={manager:{label:"Team Manager",av:"TM",home:"dashboard",pages:["dashboard","players","staff","contracts","tasks","fixtures","training","medical","analysis","documents"]},finance:{label:"Finance and Operations",av:"FO",home:"finance",pages:["finance"]},medical:{label:"Medical",av:"MD",home:"medical",pages:["medical"]}};
